<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ulusoy Galerisi</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="header">
    <div class="header-content">
      <div class="header-title">
        <button class="home-btn" id="home-btn">🏠</button>
        <h1>Ulusoy</h1>
        <p class="subtitle">Resim Galerisi</p>
      </div>
      <div class="header-right">
        <button class="list-toggle-btn" id="list-toggle-btn">🛒 Listem <span class="list-count" id="list-count">0</span></button>
        <input type="text" class="search-box" id="search-input" placeholder="Ara...">
      </div>
    </div>
  </div>

  <div class="breadcrumb" id="breadcrumb" hidden></div>

  <div class="container">
    <div class="main-content" id="mainContent">
      <div id="category-grid" class="category-grid"></div>
      <div id="gallery-section" class="gallery-section" hidden>
        <div class="gallery-header">
          <button class="back-btn" id="back-to-categories">← Geri</button>
          <h2 class="gallery-title" id="gallery-title"></h2>
        </div>
        <div id="gallery" class="gallery"></div>
        <div id="empty-state" class="empty-state" hidden>Resim bulunamadı</div>
      </div>
    </div>
  </div>

  <!-- 🛒 Liste Paneli -->
  <div class="list-overlay" id="list-overlay" hidden></div>
  <div class="list-panel" id="list-panel" hidden>
    <div class="list-panel-header">
      <h3>🛒 Listem</h3>
      <button class="list-panel-close" id="list-panel-close">✕</button>
    </div>
    <div id="list-items" class="list-items">
      <p class="list-empty-msg">Henüz ürün eklenmedi.</p>
    </div>
    <div class="list-panel-footer">
      <button class="clear-list-btn" id="clear-list-btn">🗑️ Listeyi Temizle</button>
      <button class="whatsapp-btn" id="whatsapp-btn" disabled>📱 WhatsApp'ta Gönder</button>
    </div>
  </div>

  <!-- 📦 Adet Seçme Modalı -->
  <div class="qty-modal-overlay" id="qty-modal-overlay" hidden>
    <div class="qty-modal-box">
      <h3 class="qty-modal-title">Listeye Ekle</h3>
      <p class="qty-modal-product" id="qty-modal-product"></p>
      <label class="qty-label">Adet:</label>
      <input type="text" id="qty-input" class="qty-input" placeholder="Örn: 5" inputmode="numeric">
      <div class="qty-modal-actions">
        <button class="qty-cancel-btn" id="qty-cancel-btn">İptal</button>
        <button class="qty-confirm-btn" id="qty-confirm-btn">✓ Listeye Ekle</button>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-container">
      <button class="lb-close" id="lb-close">✕</button>
      <div class="lb-viewer">
        <button class="lb-nav" id="lb-prev">❮</button>
        <img id="lb-img" alt="">
        <button class="lb-nav" id="lb-next">❯</button>
      </div>
      <div class="lb-controls">
        <span class="lb-info" id="lb-info"></span>
        <button class="lb-add-btn" id="lb-add-btn">+ Listeye Ekle</button>
        <a class="lb-download" id="lb-download" download>İndir</a>
      </div>
    </div>
  </div>

  <script src="./app.js?v=6"></script>
</body>
</html>
